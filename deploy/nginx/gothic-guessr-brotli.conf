# Brotli for text (Debian package libnginx-mod-http-brotli-filter). Installed by deploy/scripts/bootstrap.sh into
# /etc/nginx/snippets/ only when the module is present; the site config includes it through a glob.
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types application/javascript text/javascript text/css application/json;
