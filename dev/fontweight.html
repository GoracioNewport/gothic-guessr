<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font weight</title>
    <style>
      :root {
        --gold: #c9a44c;
        --gold-line: rgba(201, 164, 76, 0.45);
        --text: #e4d8bd;
        --hint: #ab9b7c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background: #0b0d12;
        font: 14px/1.4 -apple-system, system-ui, sans-serif;
      }
      body.art {
        background: #0b0d12 url('/ui/gothic/MENU_BACK_ADDON.webp') center / cover fixed no-repeat;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
        padding: 10px 16px;
        background: rgba(10, 11, 15, 0.94);
        border-bottom: 1px solid #2a2a30;
      }
      header h1 { font-size: 15px; margin: 0 8px 0 0; }
      header label { display: inline-flex; gap: 6px; align-items: center; }
      header .note { color: #8d8a80; font-size: 12px; }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 16px;
        padding: 16px;
      }
      .card {
        position: relative;
        padding: 14px 18px 16px;
        background: rgba(8, 9, 12, 0.86);
        border: 1px solid var(--gold-line);
        outline: 2px solid transparent;
        cursor: pointer;
      }
      .card.current { outline-color: rgba(120, 180, 255, 0.55); }
      .card.picked { outline-color: #f3d68a; }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font: 12px/1.3 ui-monospace, Menlo, monospace;
        color: #9a958a;
        margin-bottom: 8px;
      }
      .meta b { color: #f3d68a; }
      .menu-btn {
        border: 1px solid var(--gold-line);
        padding: 8px 14px;
        margin-bottom: 8px;
        background: linear-gradient(#2a2114, #120f0a);
      }
      .menu-btn .t { font-family: 'Gothic Old', serif; color: var(--gold); font-size: 26px; line-height: 1.1; }
      :lang(ru) .menu-btn .t { font-family: 'Gothic Old RU', 'Gothic Old', serif; }
      :lang(pl) .menu-btn .t { font-family: 'Gothic Old PL', 'Gothic Old', serif; }
      .menu-btn .h { color: var(--hint); }
      h3 { font-family: 'Gothic Old', serif; color: var(--gold); font-weight: 400; font-size: 26px; margin: 10px 0 4px; }
      :lang(ru) h3 { font-family: 'Gothic Old RU', 'Gothic Old', serif; }
      :lang(pl) h3 { font-family: 'Gothic Old PL', 'Gothic Old', serif; }
      ul { margin: 0; padding-left: 20px; }
      li { margin: 2px 0; }
      li::marker { color: var(--gold); }
      .sample { line-height: 1.45; }
    </style>
  </head>
  <body class="art">
    <header>
      <h1>Text font weight</h1>
      <label>Language
        <select id="lang">
          <option value="ru">Русский</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="pl">Polski</option>
        </select>
      </label>
      <label>Size <input id="size" type="range" min="12" max="24" value="15" /> <span id="sizeVal">15 px</span></label>
      <label><input id="art" type="checkbox" checked /> menu backdrop</label>
      <span class="note">Click a card to mark your pick (saved in the URL). Blue frame = what the game uses now.</span>
    </header>
    <main id="grid"></main>
    <script type="module" src="./fontweight.ts"></script>
  </body>
</html>
