<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panorama harness</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #eee;
        font: 13px/1.4 ui-monospace, Menlo, monospace; }
      #pano { position: absolute; inset: 0; }
      #hud { position: absolute; top: 8px; left: 8px; z-index: 10; background: rgba(0, 0, 0, 0.65);
        padding: 8px 10px; border-radius: 6px; max-width: 420px; pointer-events: none; }
      #hud b { color: #ffd54f; }
      #hud .row { white-space: pre; }
      #ctl { position: absolute; top: 8px; right: 8px; z-index: 10; background: rgba(0, 0, 0, 0.65);
        padding: 8px 10px; border-radius: 6px; display: flex; gap: 6px; align-items: center; }
      #ctl input { width: 9em; }
      #log { position: absolute; bottom: 48px; left: 8px; z-index: 10; background: rgba(0, 0, 0, 0.55);
        padding: 6px 10px; border-radius: 6px; max-height: 30vh; overflow: auto; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="pano"></div>
    <div id="hud">loading…</div>
    <div id="ctl">
      <label>key <input id="goto-id" type="text" value="" /></label>
      <button id="goto">go</button>
      <button id="goto-instant">go (instant)</button>
      <button id="freeze">freeze</button>
      <button id="unfreeze">unfreeze</button>
      <button id="nolook">no look</button>
      <button id="look">look</button>
    </div>
    <div id="log"></div>
    <script type="module" src="/dev/pano.ts"></script>
  </body>
</html>
